  OffsetX: 107.64      # 기준 X 좌표 (mm)
  OffsetY: 976.3        # 기준 Y 좌표 (mm)
  TowerWidth: 46.333    # X 방향 타워 간격 (mm)  — PositionCalculator_Sym 전용
  TowerHeight: 50.0     # Y 방향 타워 간격 (mm)  — PositionCalculator_Sym 전용

# ===== Position Calculator 물리 상수 =====
PositionConstants:
  TiltingAxis: 53.5         # mm, 드는 점부터 틸팅 축까지 거리 (레거시, 현재 미사용)
  RotationAxisAngle: 11.72  # degree, Rotation axis 기준각
  RotationAxisDist: 24    # mm, Rotation axis 거리
  CenterToBottom: 79.5       # mm, 틸팅 기준점으로부터 모듈 중심까지 수직 거리 (수식의 y)
  AxisToModule: 72.0         # mm, 틸팅 축으로부터 모듈 중심까지 수평 거리 (수식의 x)

AUX:
  WC:
    CALIB: 0.05            # mm/ns
    CENTER: [-46.1234, -94.5808]     # Reference timing offsets (ns) for X and Y
    THRESHOLD: 0.3         # Leading-edge fraction
    POSCUT: 5           # Optional |x|,|y| cut in mm

  # Hodoscope (legacy KEK 16x16 + TB2026 CERN square/round) and the
  # WC<->Hodo INCLINATION_CUT are deactivated for now — DWC is the
  # position detector in use this run, so the hodoscope hardware isn't
  # needed. TBaux's hodoscope Fill*/Draw logic is untouched; see
  # config_general_hodo_astro_reference.yml for the full block (AUX.Hodoscope
  # + INCLINATION_CUT) to restore if the hodoscope comes back into use,
  # and dqm_freeform.html for the matching (commented-out) "Hodo" checkbox.

  # ===== DWC (Delayed Wire Chamber) ========================================
  # Restored from TB2025 (CERN). Two DWCs, each read out as 4 timing edges
  # (Right/Left/Up/Down). Selected/loaded via --AUXMode token "DWC" and/or
  # --AUXCutMode "DWC" | "DWCPID". Gracefully disabled if DWC1R/L/U/D and
  # DWC2R/L/U/D are not present in the loaded mapping (e.g. DWC not
  # installed for a given run) — see DQM/include/TBaux.h.
  # PLACEHOLDER: constants below are the TB2025 CERN calibration (also
  # hardcoded in DQM/function.h for the legacy standalone tools). They will
  # almost certainly need to be recalibrated for the TB2026 DWC hardware/
  # geometry once real data is available.
  DWC:
    THRESHOLD: 0.4   # Leading-edge fraction used for DWC timing
    # [1X_slope, 1X_intercept, 1Y_slope, 1Y_intercept,
    #  2X_slope, 2X_intercept, 2Y_slope, 2Y_intercept] (mm/ns, mm)
    CALIB: [0.180654, 0.217961, -0.180342, -0.0994697, 0.181416, -0.00911072, -0.17822, -0.0489771]
    CENTER: [-5.24, -8.416, -2.834, -9.524] # 1X, 1Y, 2X, 2Y beam-center offsets (mm)
    CORR: 4     # Max |DWC1 - DWC2| per axis (mm) for the DWC correlation cut
    POSCUT: -1  # Optional |DWC1 X|,|DWC1 Y| absolute cut (mm); <=0 disables

  # ===== PID (Particle Identification) =====================================
  # Restored from TB2025 (CERN): PS (preshower), MC (muon counter),
  # CC1/CC2 (Cherenkov counters), TC (tail catcher). PS/MC/CC1/CC2/TC 1D
  # PeakADC plots are drawn whenever --AUXMode includes "PID"; the PS/MC/
  # CC1/CC2-based event selection is used by --AUXCutMode "DWCPID".
  # Integration windows for these channels live in ModuleConfig below.
  # PLACEHOLDER thresholds — retune once real TB2026 beam data is available.
  PID:
    PS_THRESHOLD_PEAKADC: 424  # "no --particle" cut: reject if PS PeakADC < this
    MC_VETO_PEAKADC: 38        # reject if MC PeakADC < this (ported as-is from TB2025)

  # Per-particle CC1/CC2/PS windows, selected via `--particle PION|KAON|PROTON`
  # (see TBaux::SetParticle / IsPassing). CC1: -1 means "not used" (PROTON).
  # PLACEHOLDER: only PION values are known from TB2025; KAON/PROTON are
  # rough guesses and must be retuned from TB2026 beam data.
  PION:
    CC1: 86
    CC2: 136
    PS_INIT: 80
    PS_FIN: 202
  KAON:
    CC1: 40
    CC2: 90
    PS_INIT: 80
    PS_FIN: 202
  PROTON:
    CC1: -1
    CC2: 40
    PS_INIT: 80
    PS_FIN: 202

