# ===== Pedestal averaging window (per channel name) ========================
# Number of waveform bins (counted from bin 1) used to compute the per-event
# pedestal in Get{Int,Peak}ADC. Read by both TBplotengine (main detector)
# and TBaux (WC/DWC/PID) via TBpedConfig::Load.
#
# Lookup order (highest priority wins):
#   1. ByName[name]                  - exact channel-name override
#   2. ByPrefix[prefix]              - matches if name starts with `prefix`
#                                      AND the next character is a digit
#                                      (so "S" hits S1..S64 but not "SiPM")
#   3. Default                       - fallback for everything else
#
# To turn this off entirely, remove the section or set every entry's
# value to 100; the C++ side then preserves the legacy 100-bin window
# (which is also the compile-time default if PedestalBins is missing).
PedestalBins:
  Default: 100
  ByPrefix:
    S: 50    # MCP scintillator single channels (S1..S64)
    C: 50    # MCP cerenkov single channels    (C1..C64)
  # ByName:
  #   M1-T1-C: 80  # uncomment to override a specific module channel (format: M{1-9}-T{1-4}-{C,S})
  #   WCX:   80    # or a wire-chamber channel

ModuleConfig:
  Trg1: [80, 230]
  Trg2: [80, 230]
  VETO: [100, 200]
  trg1NIM: [100, 200]
  trg2NIM: [100, 200]
  VETONIM: [100, 200]
  COIN: [200, 900]
  WCX: [400, 800]
  WCY: [400, 800]
  NIM: [400, 800]
  # PID (TB2025 restoration, placeholder windows for TB2026 — retune once
  # real beam data is available). PeakADC-based (TBaux always fills these
  # with PeakADC, see TBmonit::LoopLive/LoopAfterRun).
  PS: [200, 320]
  MC: [650, 850]
  TC: [300, 450]
  CC1: [600, 850]
  CC2: [600, 850]
  # Leakage counters (LC1..LC4 placeholder count/wiring; drawn via
  # --type single --module LC1 LC2 ... — wide IntADC binning is applied
  # automatically for any channel name containing "LC").
  LC1: [120, 310]
  LC2: [120, 310]
  LC3: [120, 310]
  LC4: [120, 310]
  # DWC (Delayed Wire Chamber) timing channels — windows here are only
  # used if DWC is ever plotted via --type single; the DWC position/cut
